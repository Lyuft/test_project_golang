<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Управление пользователями</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .form-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .form-card h2 {
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .table-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow-x: auto;
        }

        .table-container h2 {
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        th {
            background: #f8f9fa;
            color: #555;
            font-weight: 600;
        }

        tbody tr {
            cursor: pointer;
            transition: background 0.2s;
        }

        tbody tr:hover {
            background: #f0f4ff;
        }

        .message {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 8px;
            color: white;
            animation: slideIn 0.3s ease-out;
            z-index: 1000;
        }

        .message.success { background: #4CAF50; }
        .message.error { background: #f44336; }
        .message.info { background: #2196F3; }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 18px;
        }

        .refresh-btn {
            background: #6c757d;
            padding: 8px 20px;
            font-size: 14px;
        }

        /* 🔍 Modal / Detail View Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            transform: translateY(-20px);
            transition: transform 0.3s;
        }

        .modal-overlay.active .modal {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #667eea;
        }

        .modal-header h3 {
            color: #333;
        }

        .modal-close {
            background: #e0e0e0;
            color: #333;
            padding: 8px 16px;
            font-size: 14px;
        }

        .modal-close:hover {
            background: #ccc;
        }

        .user-detail {
            display: grid;
            gap: 15px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: #666;
            font-weight: 500;
        }

        .detail-value {
            color: #333;
            font-weight: 600;
            text-align: right;
        }

        .modal-actions {
            margin-top: 25px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-edit {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .btn-delete {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }

        .btn-back {
            background: #6c757d;
        }

        /* Edit form in modal */
        .edit-form .form-group {
            margin-bottom: 15px;
        }

        .edit-form .form-group input {
            padding: 10px;
        }

        .hidden {
            display: none !important;
        }

        .action-cell button {
            padding: 6px 12px;
            font-size: 12px;
            margin-right: 5px;
        }

        @media (max-width: 768px) {
            .form-row { grid-template-columns: 1fr; }
            .detail-row { flex-direction: column; gap: 5px; }
            .detail-value { text-align: left; }
            .modal-actions { flex-direction: column; }
            .modal-actions button { width: 100%; }
            th, td { font-size: 12px; padding: 8px; }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- 📝 Форма добавления -->
    <div class="form-card">
        <h2>➕ Добавить пользователя</h2>
        <form id="userForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="name">Имя *</label>
                    <input type="text" id="name" name="name" required placeholder="Введите имя">
                </div>
                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" required placeholder="user@example.com">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="password">Пароль *</label>
                    <input type="password" id="password" name="password" required placeholder="Минимум 6 символов">
                </div>
                <div class="form-group">
                    <label for="age">Возраст</label>
                    <input type="number" id="age" name="age" placeholder="18-100">
                </div>
            </div>
            <div class="form-group">
                <label for="department">Отдел</label>
                <input type="text" id="department" name="department" placeholder="Например: IT, HR, Sales">
            </div>
            <button type="submit">Создать пользователя</button>
        </form>
    </div>

    <!-- 📋 Список пользователей -->
    <div class="table-container">
        <h2>
            📋 Список пользователей
            <button onclick="loadUsers()" class="refresh-btn">🔄 Обновить</button>
        </h2>
        <div id="usersList">
            <div class="loading">Загрузка...</div>
        </div>
    </div>
</div>

<!-- 🔍 Modal для просмотра/редактирования пользователя -->
<div id="userModal" class="modal-overlay">
    <div class="modal">
        <div class="modal-header">
            <h3 id="modalTitle">👤 Пользователь</h3>
            <button class="modal-close" onclick="closeModal()">✕ Закрыть</button>
        </div>

        <!-- Режим просмотра -->
        <div id="viewMode">
            <div class="user-detail" id="userDetailContent"></div>
            <div class="modal-actions">
                <button class="btn-edit" onclick="switchToEdit()">✏️ Редактировать</button>
                <button class="btn-delete" onclick="deleteUser()">🗑️ Удалить</button>
                <button class="btn-back" onclick="closeModal()">↩️ Назад</button>
            </div>
        </div>

        <!-- Режим редактирования -->
        <div id="editMode" class="hidden">
            <form id="editForm" class="edit-form">
                <input type="hidden" id="editId" name="id">
                <div class="form-group">
                    <label for="editName">Имя *</label>
                    <input type="text" id="editName" name="name" required>
                </div>
                <div class="form-group">
                    <label for="editEmail">Email *</label>
                    <input type="email" id="editEmail" name="email" required>
                </div>
                <div class="form-group">
                    <label for="editPassword">Новый пароль</label>
                    <input type="password" id="editPassword" name="password" placeholder="Оставьте пустым, чтобы не менять">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="editAge">Возраст</label>
                        <input type="number" id="editAge" name="age" placeholder="18-100">
                    </div>
                    <div class="form-group">
                        <label for="editDepartment">Отдел</label>
                        <input type="text" id="editDepartment" name="department">
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="submit" class="btn-edit">💾 Сохранить</button>
                    <button type="button" class="btn-back" onclick="switchToView()">↩️ Отмена</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    // Глобальная переменная для текущего пользователя
    let currentUser = null;

    document.addEventListener('DOMContentLoaded', loadUsers);

    // 🔹 Загрузка списка пользователей
    async function loadUsers() {
        const usersDiv = document.getElementById('usersList');
        usersDiv.innerHTML = '<div class="loading">Загрузка...</div>';

        try {
            const response = await fetch('/api/users/list');
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const users = await response.json();
            displayUsers(users);
        } catch (error) {
            console.error('Ошибка загрузки:', error);
            usersDiv.innerHTML = `<div class="loading" style="color: red;">❌ Ошибка: ${error.message}</div>`;
        }
    }

    // 🔹 Отображение таблицы с кликабельными строками
    function displayUsers(users) {
        const usersDiv = document.getElementById('usersList');

        if (!users || users.length === 0) {
            usersDiv.innerHTML = '<div class="loading">📭 Нет пользователей</div>';
            return;
        }

        let html = `
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Имя</th>
                        <th>Email</th>
                        <th>Возраст</th>
                        <th>Отдел</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody>
        `;

        for (const user of users) {
            const id = user.id || user.ID || '-';
            const name = escapeHtml(user.name || user.Name || '-');
            const email = escapeHtml(user.email || user.Email || '-');
            const age = user.age || user.Age || '-';
            const dept = escapeHtml(user.department || user.Department || '-');

            html += `
                <tr onclick="openUserDetail('${id}')" style="cursor: pointer;">
                    <td>${id}</td>
                    <td><strong>${name}</strong></td>
                    <td>${email}</td>
                    <td>${age}</td>
                    <td>${dept}</td>
                    <td class="action-cell" onclick="event.stopPropagation()">
                        <button onclick="openUserDetail('${id}')" style="background:#667eea;padding:6px 12px;font-size:12px;">👁️</button>
                    </td>
                </tr>
            `;
        }

        html += `</tbody></table>`;
        usersDiv.innerHTML = html;
    }

    // 🔹 Открытие детали пользователя
    async function openUserDetail(userId) {
        const modal = document.getElementById('userModal');
        const viewMode = document.getElementById('viewMode');
        const editMode = document.getElementById('editMode');
        const detailContent = document.getElementById('userDetailContent');

        detailContent.innerHTML = '<div class="loading">Загрузка...</div>';
        viewMode.classList.remove('hidden');
        editMode.classList.add('hidden');
        modal.classList.add('active');

        try {
            // 🔸 Предполагаем endpoint /api/users/{id}
            const response = await fetch(`/api/users/${userId}`);
            if (!response.ok) throw new Error('Пользователь не найден');

            const user = await response.json();
            currentUser = user;
            renderUserDetail(user);
            populateEditForm(user);
        } catch (error) {
            console.error('Ошибка:', error);
            detailContent.innerHTML = `<div style="color:red;">❌ ${error.message}</div>`;
        }
    }

    // 🔹 Отображение данных пользователя
    function renderUserDetail(user) {
        const content = document.getElementById('userDetailContent');
        const id = user.id || user.ID || '-';
        const name = escapeHtml(user.name || user.Name || '-');
        const email = escapeHtml(user.email || user.Email || '-');
        const age = user.age || user.Age || '-';
        const dept = escapeHtml(user.department || user.Department || '-');
        const createdAt = user.created_at || user.createdAt || user.created || '—';

        content.innerHTML = `
            <div class="detail-row">
                <span class="detail-label">🆔 ID:</span>
                <span class="detail-value">${id}</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">👤 Имя:</span>
                <span class="detail-value">${name}</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">📧 Email:</span>
                <span class="detail-value">${email}</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">🎂 Возраст:</span>
                <span class="detail-value">${age}</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">🏢 Отдел:</span>
                <span class="detail-value">${dept || 'Не указан'}</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">📅 Создан:</span>
                <span class="detail-value">${formatDate(createdAt)}</span>
            </div>
        `;
    }

    // 🔹 Заполнение формы редактирования
    function populateEditForm(user) {
        document.getElementById('editId').value = user.id || user.ID || '';
        document.getElementById('editName').value = user.name || user.Name || '';
        document.getElementById('editEmail').value = user.email || user.Email || '';
        document.getElementById('editAge').value = user.age || user.Age || '';
        document.getElementById('editDepartment').value = user.department || user.Department || '';
        document.getElementById('editPassword').value = '';
    }

    // 🔹 Переключение в режим редактирования
    function switchToEdit() {
        document.getElementById('viewMode').classList.add('hidden');
        document.getElementById('editMode').classList.remove('hidden');
        document.getElementById('modalTitle').textContent = '✏️ Редактирование';
    }

    // 🔹 Переключение в режим просмотра
    function switchToView() {
        document.getElementById('editMode').classList.add('hidden');
        document.getElementById('viewMode').classList.remove('hidden');
        document.getElementById('modalTitle').textContent = '👤 Пользователь';
        if (currentUser) renderUserDetail(currentUser);
    }

    // 🔹 Закрытие модального окна
    function closeModal() {
        document.getElementById('userModal').classList.remove('active');
        currentUser = null;
    }

    // 🔹 Закрытие по клику вне модалки
    document.getElementById('userModal').addEventListener('click', (e) => {
        if (e.target.id === 'userModal') closeModal();
    });

    // 🔹 Удаление пользователя
    async function deleteUser() {
        if (!currentUser) return;
        const id = currentUser.id || currentUser.ID;

        if (!confirm(`❓ Вы уверены, что хотите удалить пользователя "${currentUser.name || currentUser.Name}"?`)) {
            return;
        }

        try {
            const response = await fetch(`/api/users/${id}`, {
                method: 'DELETE'
            });

            if (response.ok) {
                showMessage('✅ Пользователь удалён', 'success');
                closeModal();
                loadUsers();
            } else {
                const text = await response.text();
                showMessage('❌ ' + text, 'error');
            }
        } catch (error) {
            showMessage('❌ Ошибка: ' + error.message, 'error');
        }
    }

    // 🔹 Сохранение изменений
    document.getElementById('editForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const formData = new FormData(e.target);
        const id = document.getElementById('editId').value;
        const submitBtn = e.target.querySelector('button[type="submit"]');

        submitBtn.disabled = true;
        submitBtn.textContent = 'Сохранение...';

        try {
            const response = await fetch(`/api/users/${id}`, {
                method: 'PUT',
                body: formData
            });

            if (response.ok) {
                const updatedUser = await response.json();
                currentUser = updatedUser;
                showMessage('✅ Изменения сохранены', 'success');
                renderUserDetail(updatedUser);
                switchToView();
            } else {
                const text = await response.text();
                showMessage('❌ ' + text, 'error');
            }
        } catch (error) {
            showMessage('❌ Ошибка: ' + error.message, 'error');
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = '💾 Сохранить';
        }
    });

    // 🔹 Отправка формы создания
    document.getElementById('userForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const submitBtn = e.target.querySelector('button');
        const originalText = submitBtn.textContent;

        submitBtn.textContent = 'Сохранение...';
        submitBtn.disabled = true;

        try {
            const response = await fetch('/api/users', {
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                showMessage('✅ Пользователь создан!', 'success');
                e.target.reset();
                loadUsers();
            } else {
                const text = await response.text();
                showMessage('❌ ' + text, 'error');
            }
        } catch (error) {
            showMessage('❌ Ошибка: ' + error.message, 'error');
        } finally {
            submitBtn.textContent = originalText;
            submitBtn.disabled = false;
        }
    });

    // 🔹 Вспомогательные функции
    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function formatDate(dateStr) {
        if (!dateStr || dateStr === '—') return '—';
        try {
            return new Date(dateStr).toLocaleString('ru-RU');
        } catch {
            return dateStr;
        }
    }

    function showMessage(text, type) {
        const message = document.createElement('div');
        message.className = `message ${type}`;
        message.textContent = text;
        document.body.appendChild(message);
        setTimeout(() => message.remove(), 3000);
    }

    // 🔹 Обработка клавиши Escape для закрытия модалки
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeModal();
    });
</script>
</body>
</html>
