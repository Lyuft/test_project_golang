<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .form-content {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        input:hover {
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        button:active {
            transform: translateY(0);
        }

        .message {
            margin: 20px 30px 30px 30px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            display: none;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading {
            background-color: #e7f3ff;
            color: #004085;
            border: 1px solid #b8daff;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 480px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .form-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📝 User Management System</h1>
        <p>Add new user to the database</p>
    </div>

    <div class="form-content">
        <form id="userForm">
            <div class="form-group">
                <label for="id">🆔 User ID:</label>
                <input type="text" id="id" name="id" required placeholder="Enter unique user ID">
            </div>

            <div class="form-group">
                <label for="name">👤 Full Name:</label>
                <input type="text" id="name" name="name" required placeholder="Enter full name">
            </div>

            <div class="form-group">
                <label for="email">📧 Email Address:</label>
                <input type="email" id="email" name="email" required placeholder="Enter email address">
            </div>

            <div class="form-group">
                <label for="password">🔒 Password:</label>
                <input type="password" id="password" name="password" required placeholder="Enter password">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="department">🏢 Department:</label>
                    <input type="text" id="department" name="department" required placeholder="Enter department">
                </div>

                <div class="form-group">
                    <label for="age">🎂 Age:</label>
                    <input type="number" id="age" name="age" required placeholder="Enter age" min="18" max="120">
                </div>
            </div>

            <button type="submit">➕ Add User</button>
        </form>
    </div>

    <div id="message" class="message"></div>
</div>

<script>
    document.getElementById('userForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const messageDiv = document.getElementById('message');

        // Показываем загрузку
        messageDiv.style.display = 'block';
        messageDiv.className = 'message loading';
        messageDiv.textContent = '⏳ Adding user, please wait...';

        // Собираем данные из формы
        const formData = new FormData();
        formData.append('id', document.getElementById('id').value);
        formData.append('name', document.getElementById('name').value);
        formData.append('email', document.getElementById('email').value);
        formData.append('password', document.getElementById('password').value);
        formData.append('department', document.getElementById('department').value);
        formData.append('age', document.getElementById('age').value);

        try {
            // Отправляем как form-data
            const response = await fetch('/add-user', {
                method: 'POST',
                body: formData  // Не устанавливаем Content-Type, браузер установит сам с boundary
            });

            // Получаем ответ как текст для отладки
            const responseText = await response.text();
            console.log('Server response:', responseText);

            // Пытаемся распарсить JSON
            let result;
            try {
                result = JSON.parse(responseText);
            } catch (e) {
                console.error('Failed to parse JSON:', responseText);
                throw new Error('Server returned invalid response format');
            }

            if (response.ok && result.success) {
                // Успех
                messageDiv.className = 'message success';
                messageDiv.textContent = '✅ ' + (result.message || 'User added successfully!');
                document.getElementById('userForm').reset();

                // Авто-скрытие через 3 секунды
                setTimeout(() => {
                    messageDiv.style.display = 'none';
                }, 3000);
            } else {
                // Ошибка от сервера
                messageDiv.className = 'message error';
                messageDiv.textContent = '❌ ' + (result.error || result.message || 'Failed to add user');
            }
        } catch (error) {
            console.error('Network error:', error);
            messageDiv.className = 'message error';
            messageDiv.textContent = '❌ Connection error: ' + error.message + '. Make sure the server is running.';
        }
    });
</script>
</body>
</html>
