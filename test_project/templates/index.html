<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Добавить пользователя</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        input { margin: 5px; padding: 8px; width: 200px; display: block; }
        button { padding: 8px 20px; background: #4CAF50; color: white; border: none; cursor: pointer; margin-top: 10px; }
        .success { color: green; margin-top: 10px; }
        .error { color: red; margin-top: 10px; }
    </style>
</head>
<body>
<h2>Добавить пользователя</h2>
<form id="userForm">
    <input type="text" name="name" placeholder="Имя" required>
    <input type="email" name="email" placeholder="Email" required>
    <input type="password" name="password" placeholder="Пароль" required>
    <input type="number" name="age" placeholder="Возраст">
    <input type="text" name="department" placeholder="Отдел">
    <button type="submit">Создать</button>
</form>
<div id="message"></div>

<script>
    document.getElementById('userForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const formData = new FormData(e.target);

        try {
            const response = await fetch('/api/users', {
                method: 'POST',
                body: formData
            });

            const text = await response.text();
            const messageDiv = document.getElementById('message');

            if (response.ok) {
                messageDiv.className = 'success';
                messageDiv.innerHTML = '✅ Пользователь успешно создан! <a href="/">Обновить</a>';
                e.target.reset();
            } else {
                messageDiv.className = 'error';
                messageDiv.innerHTML = '❌ ' + text;
            }
        } catch (error) {
            document.getElementById('message').innerHTML = '❌ Ошибка: ' + error.message;
        }
    });
</script>
</body>
</html>
